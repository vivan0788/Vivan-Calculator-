<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the layout use the full phone screen; no zoom lock so users can still pinch-zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b1f">
  <title>Vivan Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background: gradient + blurred orbs are drawn entirely in CSS (.bg, .bg::before, .bg::after) -->
  <div class="bg" aria-hidden="true"></div>

  <main class="app">
    <!-- ============ Calculator ============ -->
    <section class="calc glass" id="calc" aria-label="Calculator">
      <header class="bar">
        <h1>Vivan Calculator</h1>
        <button type="button" class="chip" id="histToggle" aria-expanded="false" aria-controls="history">History</button>
      </header>

      <!-- Display: expression (scrolls horizontally when long) + result (auto-shrinks) -->
      <div class="display" role="group" aria-label="Display">
        <div class="expr" id="expr" tabindex="0" aria-label="Expression"><span id="exprText"></span></div>
        <output class="result" id="result" data-size="l" aria-live="polite">0</output>
      </div>

      <!-- Keypad: data-k holds the internal key value used by script.js -->
      <div class="keys" id="keys">
        <button type="button" class="key fn danger" data-k="AC" aria-label="All clear">AC</button>
        <button type="button" class="key fn" data-k="DEL" aria-label="Delete last character">DEL</button>
        <button type="button" class="key fn" data-k="%" aria-label="Percent">%</button>
        <button type="button" class="key op" data-k="/" aria-label="Divide">÷</button>

        <button type="button" class="key" data-k="7">7</button>
        <button type="button" class="key" data-k="8">8</button>
        <button type="button" class="key" data-k="9">9</button>
        <button type="button" class="key op" data-k="*" aria-label="Multiply">×</button>

        <button type="button" class="key" data-k="4">4</button>
        <button type="button" class="key" data-k="5">5</button>
        <button type="button" class="key" data-k="6">6</button>
        <button type="button" class="key op" data-k="-" aria-label="Subtract">−</button>

        <button type="button" class="key" data-k="1">1</button>
        <button type="button" class="key" data-k="2">2</button>
        <button type="button" class="key" data-k="3">3</button>
        <button type="button" class="key op" data-k="+" aria-label="Add">+</button>

        <button type="button" class="key" data-k="0">0</button>
        <button type="button" class="key" data-k="." aria-label="Decimal point">.</button>
        <button type="button" class="key fn" data-k="paren" aria-label="Parenthesis">( )</button>
        <button type="button" class="key equals" data-k="=" aria-label="Equals">=</button>
      </div>
    </section>

    <!-- ============ History (side panel on desktop, slide-over sheet on mobile) ============ -->
    <aside class="history glass" id="history" aria-label="Calculation history">
      <header class="hist-head">
        <h2>History</h2>
        <div class="hist-actions">
          <button type="button" class="chip" id="histClear">Clear</button>
          <button type="button" class="chip close" id="histClose">Close</button>
        </div>
      </header>
      <p class="empty" id="histEmpty">Your calculations will appear here.</p>
      <ul id="histList"></ul>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
